name: Build MeshOregon

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meshoregon-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      commit: ${{ steps.prepare.outputs.commit }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: MeshOregon
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade "platformio>=6.2.0,<7"
      - name: Test release packaging
        run: python -m unittest discover -s bin/meshoregon -v
      - name: Enumerate every hardware target, including extra boards
        id: prepare
        run: |
          python bin/generate_ci_matrix.py all --level extra > targets-all.json
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          targets = [item for item in json.loads(Path("targets-all.json").read_text()) if item["platform"] != "native"]
          if not targets:
              raise SystemExit("No hardware targets found")
          shards = [{"targets": json.dumps(targets[start:start + 128])} for start in range(0, len(targets), 128)]
          if len(shards) > 256:
              raise SystemExit("Too many matrix shards")
          Path("targets.json").write_text(json.dumps(targets))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": shards}) + "\n")
              output.write("commit=" + subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() + "\n")
              output.write("version=" + subprocess.check_output(["python", "bin/buildinfo.py", "long"], text=True).strip() + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Building all {len(targets)} hardware targets from MeshOregon, including extra boards. Native/desktop environments are excluded.\n")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: meshoregon-targets
          path: targets.json

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/meshoregon-build.yml
    with:
      targets: ${{ matrix.targets }}
      commit: ${{ needs.prepare.outputs.commit }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: meshoregon-*
          path: artifacts
      - name: Verify full coverage and generate catalog
        env:
          COMMIT: ${{ needs.prepare.outputs.commit }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          python bin/meshoregon/package.py catalog
          --artifacts artifacts --output release-assets
          --expected artifacts/meshoregon-targets/targets.json
          --commit "$COMMIT" --version "$VERSION"
      - name: Publish immutable MeshOregon release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: meshoregon-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh release create "$TAG" release-assets/* --target "$COMMIT" --prerelease --latest=false \
            --title "MeshOregon $VERSION" \
            --notes "All hardware targets built from the MeshOregon branch at $COMMIT. Includes extra boards; excludes native/desktop environments."
